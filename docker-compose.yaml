services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: spring-cgv-24th
      MYSQL_ROOT_PASSWORD: "${COMPOSE_MYSQL_ROOT_PASSWORD:?Set COMPOSE_MYSQL_ROOT_PASSWORD}"
      MYSQL_USER: cgv_app
      MYSQL_PASSWORD: "${COMPOSE_MYSQL_PASSWORD:?Set COMPOSE_MYSQL_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER"
          --password="$$MYSQL_PASSWORD" "$$MYSQL_DATABASE"
          -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/spring-cgv-24th?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true"
      SPRING_DATASOURCE_USERNAME: cgv_app
      SPRING_DATASOURCE_PASSWORD: "${COMPOSE_MYSQL_PASSWORD:?Set COMPOSE_MYSQL_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUE: "${JWT_ISSUE}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      JWT_ACCESS_TOKEN_EXPIRATION: "${JWT_ACCESS_TOKEN_EXPIRATION}"
      REFRESH_TOKEN_EXPIRATION: "${REFRESH_TOKEN_EXPIRATION}"
      TOSS_SECRET_KEY: "${TOSS_SECRET_KEY}"

volumes:
  mysql-data: