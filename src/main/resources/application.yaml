spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${database}?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true
    username: root
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  application:
    name: spring-cgv-24th

jwt:
  secret: ${JWT_SECRET}
  # 누가 토큰을 발급했는가
  issuer: ${JWT_ISSUE}
  # 토큰을 누가 사용하도록 발급했는지
  audience: ${JWT_AUDIENCE}
  # 토큰 만료 시간
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

logging:
  level:
    org.hibernate.SQL: debug
